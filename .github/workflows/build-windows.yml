name: Build Windows Package

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "版本号标签（例如 v0.10.2，留空则使用日期+短SHA）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller & Pillow
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Verify pure read-only source tree
        shell: pwsh
        run: |
          $forbidden = @(
            "src/auto_driver.py",
            "src/char_wishes.py",
            "src/lobby_driver.py",
            "src/decision_bridge.py",
            "src/strategy_planner.py"
          )
          foreach ($f in $forbidden) {
            if (Test-Path $f) {
              Write-Error "Forbidden automation file detected in public repo: $f"
              exit 1
            }
          }
          python -m py_compile src/bootstrap.py src/updater.py src/win_launcher.py src/platform_compat.py src/hud_badges.py src/win_diegetic_hud.py src/issue_reporter.py src/live_coach.py src/log_mirror.py src/dashboard_server.py src/analyzer.py src/note_advisor.py src/equipment_advisor.py src/skill_advisor.py scripts/build_update_bundle.py

      - name: Build HoopCoach.exe runtime shell (onedir)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean packaging/lqsncoach.spec

      - name: Assemble portable directory and lightweight hot-update bundle
        shell: pwsh
        run: |
          $out = "dist/HoopCoach"
          New-Item -ItemType Directory -Force -Path "$out/src" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/config" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/data" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/strategies" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/dashboard" | Out-Null

          # 平铺纯只读业务源码（与运行时壳分离，后续 99% 更新仅替换此处 ~0.6 MB）
          Copy-Item -Path "src/*.py" -Destination "$out/src/" -Force
          Copy-Item -Path "config/hud_config.json" -Destination "$out/config/hud_config.json" -Force
          if (Test-Path "config/app_meta.json") {
            Copy-Item -Path "config/app_meta.json" -Destination "$out/config/app_meta.json" -Force
          }
          Copy-Item -Path "strategies/*.json" -Destination "$out/strategies/" -Force
          Copy-Item -Path "dashboard/*" -Destination "$out/dashboard/" -Recurse -Force

          $staticDataFiles = @(
            "data/equipment_guide_db.json",
            "data/event_choices.json",
            "data/skill_catalog.json",
            "data/verified_mechanics.json"
          )
          foreach ($df in $staticDataFiles) {
            if (Test-Path $df) {
              Copy-Item -Path $df -Destination "$out/$df" -Force
            }
          }
          if (Test-Path "data/hoopgirls") {
            Copy-Item -Path "data/hoopgirls" -Destination "$out/data/hoopgirls" -Recurse -Force
          }
          if (Test-Path "packaging/assets/hoopcoach.ico") {
            New-Item -ItemType Directory -Force -Path "$out/packaging/assets" | Out-Null
            Copy-Item -Path "packaging/assets/hoopcoach.ico" -Destination "$out/packaging/assets/hoopcoach.ico" -Force
          }
          if (Test-Path "README.md") {
            Copy-Item -Path "README.md" -Destination "$out/使用说明.txt" -Force
          }
          if (Test-Path "LICENSE") {
            Copy-Item -Path "LICENSE" -Destination "$out/LICENSE" -Force
          }
          if (Test-Path "AGENTS.md") {
            Copy-Item -Path "AGENTS.md" -Destination "$out/AGENTS.md" -Force
          }
          if (Test-Path "docs/quickstart_guide.md") {
            New-Item -ItemType Directory -Force -Path "$out/docs" | Out-Null
            Copy-Item -Path "docs/quickstart_guide.md" -Destination "$out/docs/quickstart_guide.md" -Force
          }

          $ver = "${{ inputs.release_version }}"
          if (-not $ver) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $ver = "${{ github.ref_name }}"
            } else {
              $ver = (Get-Date -Format "yyyyMMdd") + "-" + "${{ github.sha }}".Substring(0, 7)
            }
          }

          # 读取 runtime_version 与 tag 注释作为更新日志
          $rtVer = "rt1"
          if (Test-Path "config/app_meta.json") {
            $metaObj = Get-Content "config/app_meta.json" -Raw | ConvertFrom-Json
            if ($metaObj.runtime_version) { $rtVer = $metaObj.runtime_version }
          }
          $notesFile = "dist/release_notes.txt"
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagNotes = git tag -l --format="%(contents)" "${{ github.ref_name }}"
            if ($tagNotes) {
              Set-Content -Path $notesFile -Value $tagNotes -Encoding UTF8
            }
          }
          if (-not (Test-Path $notesFile)) {
            $commitMsg = git log -1 --pretty=%B
            Set-Content -Path $notesFile -Value $commitMsg -Encoding UTF8
          }

          # 先把精确版本号的 app_meta.json 与初始 assets_state.json 写入整包目录
          python scripts/build_update_bundle.py `
            --repo-root "." `
            --dist-dir "dist" `
            --version "$ver" `
            --repo "${{ github.repository }}" `
            --runtime-version "$rtVer" `
            --portable-dir "$out" `
            --notes-file "$notesFile"

          # 压缩完整首装便携包
          $zipName = "HoopCoach-Windows-$ver.zip"
          Compress-Archive -Path "$out" -DestinationPath "dist/$zipName" -Force

          # 重新生成含 full_zip SHA256 与体积的最终 manifest.json
          python scripts/build_update_bundle.py `
            --repo-root "." `
            --dist-dir "dist" `
            --version "$ver" `
            --repo "${{ github.repository }}" `
            --runtime-version "$rtVer" `
            --full-zip "dist/$zipName" `
            --notes-file "$notesFile"

          $patchName = "HoopCoach-Patch-$ver.zip"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "PATCH_NAME=$patchName" >> $env:GITHUB_ENV
          echo "RELEASE_VER=$ver" >> $env:GITHUB_ENV

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.PATCH_NAME }}
            dist/manifest.json
            dist/assets_manifest.json
          retention-days: 30

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release_body.md
          files: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.PATCH_NAME }}
            dist/manifest.json
            dist/assets_manifest.json
          generate_release_notes: true
